name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.5.3 --out /tmp/repro-a
          python scripts/repro_release.py 1.5.3 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.5.3
          nvlx-k8s operator-plan prod --event-type MODIFIED --resource-version 12 --generation 3 --allowed --runtime-action execute | grep '"action": "patch-status"'
          nvlx-k8s operator-plan prod --event-type DELETED --resource-version 13 --generation 3 | grep '"action": "observe-delete"'
          nvlx-k8s health --api-reachable --leader --inventory-fresh | grep '"ready": true'
          python - <<'PY'
          from nvlx.generation_v153 import evaluate
          from nvlx.patch_v15 import classify_status
          assert evaluate(3,4).stale
          assert classify_status(412) == ("relist-retry", True)
          PY
