name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.1.1 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.1.1 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.1.1
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from nvlx.runtime_guard_v161 import classify_watch_line, reconnect_delay
          assert classify_watch_line({'type':'ERROR','object':{'code':503}}).action == 'reconnect'
          assert classify_watch_line({'type':'ERROR','object':{'code':410}}).action == 'relist'
          assert classify_watch_line({}).action == 'ignore-malformed'
          assert reconnect_delay(10,maximum=8) == 8
          from nvlx.k8s_controller import manifests
          kinds=[x['kind'] for x in manifests()]
          assert 'ClusterRole' in kinds and 'Deployment' in kinds and 'PodDisruptionBudget' in kinds
          PY
