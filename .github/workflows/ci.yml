name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.1.5 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.1.5 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.1.5
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from nvlx.k8s_api_v16 import ApiResponse
          from nvlx.runtime_v16 import Runtime
          event=ApiResponse(201,{'metadata':{'resourceVersion':'1'},'regarding':{'name':'prod','uid':'u1'},'reportingController':'nvlx.io/operator','reportingInstance':'pod-a'})
          assert Runtime._event_response_verified(event,'prod','u1','pod-a')
          assert not Runtime._event_response_verified(event,'prod','u2','pod-a')
          assert Runtime._object_identity_valid({'metadata':{'name':'prod','resourceVersion':'10','generation':1}})
          assert not Runtime._object_identity_valid({'metadata':{'name':'prod','resourceVersion':''}})
          PY
