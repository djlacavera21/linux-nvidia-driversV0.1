name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.2.2 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.2.2 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.2.2
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          nvlx-operator --help | grep -- '--token-file'
          nvlx-operator --help | grep -- '--watch-timeout-seconds'
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from nvlx.lease_v16 import LeaseElector
          from nvlx.runtime_v1622 import Runtime
          class C:
              def list_fleets(self):
                  from nvlx.k8s_api_v16 import ApiResponse
                  return ApiResponse(200,{'metadata':{'resourceVersion':'rv'},'items':[]})
              def watch_path(self,rv): return '/watch'
              def watch_lines(self,path): return iter(())
          e=LeaseElector(object(),'pod-a',max_clock_skew_seconds=5)
          now=datetime.now(timezone.utc)
          assert not e._fresh({'renewTime':(now+timedelta(seconds=6)).isoformat().replace('+00:00','Z'),'leaseDurationSeconds':30},now)
          r=Runtime(C(),'pod-a',leader_check=lambda:True,leader_fresh_seconds=25)
          assert r.list_and_watch_once() == 'eof' and r.ready()
          assert r._leader_verified_monotonic > 0
          r.stats.api_reachable=False
          assert not r.ready()
          assert not r.stats.leader and r._leader_verified_monotonic == 0.0
          PY
