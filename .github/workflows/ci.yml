name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.4.0 --out /tmp/repro-a
          python scripts/repro_release.py 1.4.0 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version
          nvlx-controller metrics --leader | grep nvlx_controller_leader
          nvlx-k8s crd | grep gpufleets.nvlx.io
          nvlx-k8s fleet prod --driver-version 610.57.04 --gpu-operator-version 26.7.0 | grep nvlx.io/fleet-protection
          nvlx-k8s conditions --generation 2 --ready | grep '"Ready"'
          nvlx-k8s admission-policy | grep ValidatingAdmissionPolicyBinding
          nvlx-k8s reconcile prod --generation 2 --allowed --runtime-action execute --current-wave 0 --promoted | grep '"phase": "Progressing"'
          nvlx-k8s finalize-check --deleting | grep '"remove_finalizer": true'
