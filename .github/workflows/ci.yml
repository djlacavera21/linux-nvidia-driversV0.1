name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.5.9 --out /tmp/repro-a
          python scripts/repro_release.py 1.5.9 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.5.9
          python - <<'PY'
          from nvlx.leadership_v155 import FenceToken
          from nvlx.fence_sequence_v159 import assess, verify_floor
          previous=FenceToken("controller-a",7,"42")
          renewal=FenceToken("controller-a",7,"43")
          assert assess(9,previous,10,renewal).action == "persist-next"
          assert assess(9,previous,9,renewal).action == "reject-sequence-replay"
          assert assess(9,previous,11,renewal).action == "reject-sequence-gap"
          assert assess(9,previous,10,previous).action == "reject-redundant-advance"
          assert assess(9,previous,10,FenceToken("controller-b",8,"44"),reacquired=True).allowed
          assert verify_floor(8,9).action == "replay-detected"
          assert verify_floor(9,9).allowed
          PY
