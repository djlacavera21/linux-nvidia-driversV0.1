name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 0.9.0 --out /tmp/repro-a
          python scripts/repro_release.py 0.9.0 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version
          nvlx detect --sysfs-root /definitely/not/here
          nvlx repo-plan
          nvlx health
          nvlx telemetry --format prometheus
          nvlx-fleet maintenance-plan gpu01
          nvlx-fleet placement --count 2 --product H100 --min-memory-gib 80 --compute-domain rack-a | grep gpu.nvidia.com
          nvlx-fleet gang --replicas 4 --gpus-per-replica 8 --compute-domain rack-a | grep all_or_nothing
          nvlx-fleet mig-broker --profile 1g.10gb --replicas 4
          nvlx-fleet power-policy --max-watts 700 --max-temp-c 85
          nvlx-fleet curtailment --current-watts 1000 --target-watts 800
          nvlx-fleet slo-check --healthy-fraction 1.0 --p95-startup-seconds 30
          nvlx-fleet failover-plan --source east --target west --checkpoint-ready --capacity-ready --security-ready
          nvlx-fleet gds || test $? -eq 1
          nvlx-fleet runai || test $? -eq 1
          printf '%s\n' '[{"name":"gpu-b","free_gpus":2,"power_headroom_w":100},{"name":"gpu-a","free_gpus":3,"power_headroom_w":100}]' > /tmp/candidates.json
          nvlx-fleet placement-decide /tmp/candidates.json | grep gpu-a
          nvlx-fleet audit --path /tmp/nvlx-audit.jsonl --action place --target gpu-a --allowed
          test -s /tmp/nvlx-audit.jsonl
          nvlx-fleet gpudirect || test $? -eq 2
