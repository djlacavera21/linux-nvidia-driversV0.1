name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.2.5 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.2.5 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.2.5
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          nvlx-operator --help | grep -- '--token-file'
          nvlx-operator --help | grep -- '--watch-timeout-seconds'
          python - <<'PY'
          from nvlx.k8s_api_v16 import ApiResponse
          from nvlx.runtime_v1625 import Runtime
          expected={'name':'prod','uid':'u1','generation':4}
          missing=ApiResponse(200,{'metadata':{'name':'prod','uid':'u1','resourceVersion':'11'},'status':{'phase':'Ready'}})
          good=ApiResponse(200,{'metadata':{'name':'prod','uid':'u1','generation':4,'resourceVersion':'11'},'status':{'phase':'Ready'}})
          assert not Runtime._status_response_verified(missing,expected,{'phase':'Ready'})
          assert Runtime._status_response_verified(good,expected,{'phase':'Ready'})
          PY
