name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.5.4 --out /tmp/repro-a
          python scripts/repro_release.py 1.5.4 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.5.4
          nvlx-k8s operator-plan prod --event-type MODIFIED --resource-version 12 --generation 3 --allowed --runtime-action execute | grep '"action": "patch-status"'
          nvlx-k8s operator-plan prod --event-type DELETED --resource-version 13 --generation 3 | grep '"action": "observe-delete"'
          python - <<'PY'
          from nvlx.event_dedupe_v154 import fingerprint
          from nvlx.operator_v15 import plan
          from nvlx.shutdown_v154 import evaluate
          fp=fingerprint(event_type="MODIFIED",resource_version="12",generation=3)
          assert plan("prod",event_type="MODIFIED",resource_version="12",generation=3,allowed=True,runtime_action="execute",previous_event_fingerprint=fp).action == "event-noop"
          assert evaluate(terminating=True,active_mutation=True).action == "drain"
          PY
