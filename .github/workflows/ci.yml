name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.2 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.2 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.2
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          nvlx-operator --help | grep -- '--token-file'
          nvlx-operator --help | grep -- '--watch-timeout-seconds'
          python - <<'PY'
          from urllib.parse import parse_qs, urlsplit
          from nvlx.k8s_api_v16 import KubeClient
          from nvlx.runtime_v16 import Runtime
          c=KubeClient('http://127.0.0.1:1',timeout=2,watch_timeout=41,watch_timeout_seconds=30)
          q=parse_qs(urlsplit(c.watch_path('opaque')).query)
          assert q['timeoutSeconds']==['30']
          valid={'metadata':{'name':'prod','uid':'u1','resourceVersion':'opaque-a','generation':4}}
          assert Runtime._object_identity_valid(valid)
          PY
