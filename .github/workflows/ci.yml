name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.5.7 --out /tmp/repro-a
          python scripts/repro_release.py 1.5.7 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.5.7
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from nvlx.leadership_v155 import FenceToken
          from nvlx.fence_store_v156 import save, load
          from nvlx.fence_recovery_v157 import assess
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/"fence.json"
              token=FenceToken("controller-a",7,"42")
              save(p,token)
              restored=load(p)
              assert restored == token
              assert assess(restored,current_holder="controller-a",current_epoch=7,current_resource_version="42").action == "restore"
              data=json.loads(p.read_text())
              data["token"]["epoch"]=8
              p.write_text(json.dumps(data))
              try:
                  load(p)
              except ValueError:
                  pass
              else:
                  raise AssertionError("tampered fence store must fail closed")
          assert assess(FenceToken("controller-a",8,"43"),current_holder="controller-a",current_epoch=7,current_resource_version="42").action == "rollback-detected"
          PY
