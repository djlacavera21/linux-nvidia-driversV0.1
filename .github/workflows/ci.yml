name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.1.8 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.1.8 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.1.8
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from nvlx.runtime_v16 import Runtime
          class C: pass
          r=Runtime(C(),'pod-a',watch_cache_limit=2)
          a={'metadata':{'name':'a','uid':'a','resourceVersion':'opaque-a','generation':4}}
          b={'metadata':{'name':'b','uid':'b','resourceVersion':'opaque-b','generation':1}}
          c={'metadata':{'name':'c','uid':'c','resourceVersion':'opaque-c','generation':1}}
          assert r._watch_event_disposition(a,'MODIFIED') == 'reconcile'
          assert r._watch_event_disposition(b,'MODIFIED') == 'reconcile'
          assert r._watch_event_disposition(c,'MODIFIED') == 'reconcile'
          assert len(r._watch_seen) == 2 and r.stats.watch_cache_evictions == 1
          r._prune_watch_state_from_list([c])
          assert list(r._watch_seen) == ['c'] and r.stats.watch_cache_pruned == 1
          PY
