name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.1.6 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.1.6 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.1.6
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from nvlx.runtime_v16 import Runtime
          class C: pass
          r=Runtime(C(),'pod-a',leader_check=lambda:False)
          obj={'metadata':{'name':'prod','uid':'u1','resourceVersion':'opaque-a','generation':4}}
          assert r._watch_event_disposition(obj,'MODIFIED') == 'reconcile'
          assert r._watch_event_disposition(obj,'MODIFIED') == 'duplicate'
          same_gen={'metadata':{'name':'prod','uid':'u1','resourceVersion':'opaque-b','generation':4}}
          assert r._watch_event_disposition(same_gen,'MODIFIED') == 'reconcile'
          stale={'metadata':{'name':'prod','uid':'u1','resourceVersion':'opaque-c','generation':3}}
          assert r._watch_event_disposition(stale,'MODIFIED') == 'stale-generation'
          PY
