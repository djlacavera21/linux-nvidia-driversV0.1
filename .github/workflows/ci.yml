name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 0.8.0 --out /tmp/repro-a
          python scripts/repro_release.py 0.8.0 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version
          nvlx detect --sysfs-root /definitely/not/here
          nvlx repo-plan
          nvlx health
          nvlx telemetry --format prometheus
          nvlx-fleet maintenance-plan gpu01
          nvlx-fleet waves gpu03 gpu01 gpu02 --canaries 1 --wave-size 2
          nvlx-fleet fabric-domains gpu03 gpu01 gpu02 --size 2 | grep fabric-000
          nvlx-fleet admission-policy | grep ValidatingAdmissionPolicy
          nvlx-fleet placement --count 2 --product H100 --min-memory-gib 80 --compute-domain rack-a | grep gpu.nvidia.com
          nvlx-fleet gang --replicas 4 --gpus-per-replica 8 --compute-domain rack-a | grep all_or_nothing
          nvlx-fleet mig-broker --profile 1g.10gb --replicas 4
          nvlx-fleet power-policy --max-watts 700 --max-temp-c 85
          nvlx-fleet evacuate-plan gpu01 --checkpoint-mode application
          nvlx-fleet federation-plan --primary east --required-gpus 8 east:us-east:8 west:us-west:16
          nvlx-fleet gpudirect || test $? -eq 2
