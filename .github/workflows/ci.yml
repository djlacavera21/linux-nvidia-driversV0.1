name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.1.4 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.1.4 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.1.4
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from nvlx.k8s_api_v16 import ApiResponse
          from nvlx.runtime_v16 import Runtime
          meta={'name':'prod','uid':'u1','generation':4}
          ok=ApiResponse(200,{'metadata':{'name':'prod','uid':'u1','generation':4,'resourceVersion':'12'},'status':{'phase':'Ready'}})
          bad=ApiResponse(200,{'metadata':{'name':'prod','uid':'u2','generation':4,'resourceVersion':'12'},'status':{'phase':'Ready'}})
          assert Runtime._status_response_verified(ok,meta,{'phase':'Ready'})
          assert not Runtime._status_response_verified(bad,meta,{'phase':'Ready'})
          final=ApiResponse(200,{'metadata':{'name':'prod','resourceVersion':'13','finalizers':['other.example/finalizer']}})
          assert Runtime._finalizer_response_verified(final,'prod',['other.example/finalizer'])
          assert not Runtime._finalizer_response_verified(final,'prod',[])
          PY
