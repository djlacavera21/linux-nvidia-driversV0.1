name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.3.2 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.3.2 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.3.2
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from unittest.mock import patch
          from nvlx.nvidia_inventory_v163 import NvidiaPreflight, NvidiaSnapshot
          from nvlx.runtime_v163 import Runtime as Base
          from nvlx.runtime_v1632 import Runtime
          def o(uid): return {'apiVersion':'nvidia.com/v1','metadata':{'name':'cluster-policy','uid':uid,'resourceVersion':'7'}}
          def s(uid): return NvidiaSnapshot((),(o(uid),),(),(),(),(),(('nvidia.com','v1'),),(('nvidia.com',('clusterpolicies',)),))
          vals=iter([NvidiaPreflight(True,'device-plugin',(),s('u1')),NvidiaPreflight(True,'device-plugin',(),s('u2')),NvidiaPreflight(True,'device-plugin',(),s('u2'))])
          r=Runtime(object(),'pod-a',leader_check=lambda:True); r.nvidia_inventory_check=lambda: next(vals)
          with patch.object(Base,'list_and_watch_once',return_value='eof'):
              assert r.list_and_watch_once() == 'eof'
              assert r.list_and_watch_once() == 'relist'
              assert r.list_and_watch_once() == 'eof'
          assert r.nvidia_continuity_promotions == 1
          PY
