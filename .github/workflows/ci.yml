name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.2.7 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.2.7 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.2.7
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          nvlx-operator --help | grep -- '--token-file'
          nvlx-operator --help | grep -- '--watch-timeout-seconds'
          python - <<'PY'
          from unittest.mock import patch
          from nvlx.runtime_v1626 import Runtime as RuntimeV1626
          from nvlx.runtime_v1627 import Runtime

          obj={'metadata':{'name':'prod','uid':'u1','generation':4,'resourceVersion':'10','annotations':{}}}
          r=Runtime(object(),'pod-a',leader_check=lambda:True)
          with patch.object(RuntimeV1626,'reconcile_object',return_value='standby'):
              assert r._watch_event_disposition(obj,'MODIFIED') == 'reconcile'
              assert r.reconcile_object(obj,event_type='MODIFIED') == 'standby'
          assert 'u1' not in r._watch_seen
          with patch.object(RuntimeV1626,'reconcile_object',return_value='patched'):
              assert r._watch_event_disposition(obj,'MODIFIED') == 'reconcile'
              assert r.reconcile_object(obj,event_type='MODIFIED') == 'patched'
          assert r._watch_event_disposition(obj,'MODIFIED') == 'duplicate'
          PY
