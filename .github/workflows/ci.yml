name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.5.5 --out /tmp/repro-a
          python scripts/repro_release.py 1.5.5 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.5.5
          nvlx-k8s operator-plan prod --event-type MODIFIED --resource-version 12 --generation 3 --allowed --runtime-action execute | grep '"action": "patch-status"'
          python - <<'PY'
          from nvlx.leadership_v155 import FenceToken, validate
          from nvlx.operator_v15 import plan
          from nvlx.shutdown_v154 import evaluate
          token=FenceToken("controller-a",7,"42")
          assert validate(token,current_holder="controller-a",current_epoch=7,current_resource_version="42").allowed
          assert not validate(token,current_holder="controller-b",current_epoch=8,current_resource_version="43").allowed
          assert plan("prod",event_type="MODIFIED",resource_version="12",generation=3,allowed=True,runtime_action="execute",mutation_fence_ok=False).action == "fenced"
          assert evaluate(terminating=False,active_mutation=True,leadership_valid=False).action == "fence-drain"
          PY
