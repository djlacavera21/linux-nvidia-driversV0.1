name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 0.7.0 --out /tmp/repro-a
          python scripts/repro_release.py 0.7.0 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version
          nvlx detect --sysfs-root /definitely/not/here
          nvlx repo-plan
          nvlx prime --sysfs-root /definitely/not/here
          nvlx initramfs-plan
          nvlx secureboot-verify
          nvlx session
          nvlx mig-fabric
          nvlx mig-profile-plan disabled
          nvlx health
          nvlx telemetry --format json
          nvlx telemetry --format prometheus
          nvlx rollback-preflight
          nvlx watchdog-plan
          nvlx gpu-operator-plan
          nvlx immutable-plan
          nvlx nvsdm
          nvlx dcgm-telemetry || test $? -eq 1
          nvlx topology || test $? -eq 1
          nvlx transaction-pending || test $? -eq 1
          nvlx-fleet maintenance-plan gpu01
          nvlx-fleet diag-plan --level 3
          nvlx-fleet quarantine-plan gpu01 "Xid 79"
          nvlx-fleet waves gpu03 gpu01 gpu02 --canaries 1 --wave-size 2
          nvlx-fleet alerts | grep NvlxGpuXidError
          nvlx-fleet advance-check --qualified --diagnostics-passed --security-passed
          nvlx-fleet fabric-domains gpu03 gpu01 gpu02 --size 2 | grep fabric-000
          nvlx-fleet admission-policy | grep ValidatingAdmissionPolicy
