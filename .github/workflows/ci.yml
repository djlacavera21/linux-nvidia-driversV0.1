name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.5.8 --out /tmp/repro-a
          python scripts/repro_release.py 1.5.8 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.5.8
          python - <<'PY'
          from nvlx.leadership_v155 import FenceToken
          from nvlx.fence_monotonic_v158 import assess
          from nvlx.fence_recovery_v157 import assess as recover
          previous=FenceToken("controller-a",7,"42")
          renewal=FenceToken("controller-a",7,"43")
          assert assess(previous,renewal).action == "persist-renewal"
          assert assess(previous,FenceToken("controller-a",6,"41")).action == "reject-rollback"
          assert assess(previous,FenceToken("controller-b",7,"43")).action == "reject-epoch-collision"
          assert assess(previous,renewal,reacquired=True).action == "reject-stale-reacquire"
          assert assess(previous,FenceToken("controller-b",8,"44"),reacquired=True).action == "persist-new-epoch"
          assert recover(FenceToken("controller-a",8,"43"),current_holder="controller-a",current_epoch=7,current_resource_version="42").action == "rollback-detected"
          PY
