name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and scripts
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible archive smoke test
        run: |
          python scripts/repro_release.py 1.6.3.6 --out /tmp/repro-a
          python scripts/repro_release.py 1.6.3.6 --out /tmp/repro-b
          cmp /tmp/repro-a/SHA256SUMS /tmp/repro-b/SHA256SUMS
      - name: CLI smoke test
        run: |
          nvlx --version | grep 1.6.3.6
          nvlx-operator --help | grep 'live GPUFleet Kubernetes operator'
          python - <<'PY'
          from nvlx.nvidia_inventory_v1631 import NvidiaInventoryError
          from nvlx.runtime_v1636 import Runtime
          class Store:
              def __init__(self): self.calls=0
              def load(self):
                  self.calls += 1
                  if self.calls == 1: raise NvidiaInventoryError('temporary')
                  return None,None,4,False,0
          s=Store(); r=Runtime(object(),'pod-a',leader_check=lambda:True); r.nvidia_checkpoint_store=s
          try: r._restore_checkpoint_once()
          except NvidiaInventoryError: pass
          else: raise AssertionError('first restore must fail')
          assert not r.nvidia_checkpoint_loaded
          r._restore_checkpoint_once()
          assert r.nvidia_checkpoint_loaded and s.calls == 2
          PY
