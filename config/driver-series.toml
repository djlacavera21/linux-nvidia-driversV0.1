[driver]
version = "610.57.04"
upstream_repo = "https://github.com/NVIDIA/open-gpu-kernel-modules.git"
minimum_kernel = "4.15"
architectures = ["x86_64", "aarch64"]
open_module_gpu_floor = "Turing or newer"

[policy]
require_matching_userspace = true
refuse_missing_kernel_headers = true
refuse_automatic_module_unload = true
warn_secure_boot = true
