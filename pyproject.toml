[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvlx"
version = "1.6.6.6.6.6.6.6.5"
description = "Real Kubernetes NVIDIA GPU fleet operator with canonical request-line separators, strict HTTP/1.1 Host authority syntax, canonical request Expect containment, strict request-header field-value and field-name containment, obsolete folded-header rejection, canonical origin-form request targets, strict HTTP/1.0-1.1 admission, bodyless framing, bounded ingress budgets, typed readiness propagation and checkpoint reconciliation safety"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Linux NVIDIA Drivers contributors"}]
dependencies = []

[project.scripts]
nvlx = "nvlx.cli:main"
nvlx-fleet = "nvlx.fleet_cli:main"
nvlx-controller = "nvlx.v1_cli:main"
nvlx-k8s = "nvlx.k8s_cli:main"
nvlx-operator = "nvlx.operator_cli_v16:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
