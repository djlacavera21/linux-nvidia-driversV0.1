[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvlx"
version = "1.5.0"
description = "Live Kubernetes NVIDIA GPU fleet operator with watch/relist semantics, optimistic status patching, bounded workqueues, strict field ownership, and operator health gates"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Linux NVIDIA Drivers contributors"}]
dependencies = []

[project.scripts]
nvlx = "nvlx.cli:main"
nvlx-fleet = "nvlx.fleet_cli:main"
nvlx-controller = "nvlx.v1_cli:main"
nvlx-k8s = "nvlx.k8s_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
