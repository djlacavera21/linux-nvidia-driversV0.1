[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvlx"
version = "0.8.0"
description = "NVIDIA GPU DRA placement, topology-aware scheduling, GPUDirect, MIG brokerage, power policy, evacuation, federation, and fleet safety toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Linux NVIDIA Drivers contributors"}]
dependencies = []

[project.scripts]
nvlx = "nvlx.cli:main"
nvlx-fleet = "nvlx.fleet_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
