[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvlx"
version = "0.1.0"
description = "Linux NVIDIA driver detection, planning, build, install, and diagnostics toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Linux NVIDIA Drivers contributors"}]
dependencies = []

[project.scripts]
nvlx = "nvlx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
